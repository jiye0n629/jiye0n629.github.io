function typeCode(){if(state.traits.some(x=>x===null))return '성향 설정 중';if(state.priority==='liquid')return '필요할 때 꺼내 쓰는 실속형';if(state.priority==='income')return '꾸준한 소득을 만드는 투자자형';if(state.priority==='ethical')return '사회적 가치도 살피는 투자자형';if(state.priority==='safety')return state.traits[0]===0?'안정을 지키는 투자자형':'기반을 지키며 성장하는 투자자형';if(state.priority==='growth')return state.traits[0]===1?'성장 기회를 찾는 투자자형':'신중하게 성장하는 투자자형';return '균형을 설계하는 투자자형';}
function typeNames(){return TRAITS.map((t,i)=>state.traits[i]===null?'미설정':t.names[state.traits[i]]).join(' · ');}
function typeDescription(){return `${PRIORITIES[state.priority].desc} ${state.traits[0]===0?'가까운 목표 자금은 원금을 지키는 쪽으로 준비합니다.':'오래 두어도 되는 일부 돈으로 수익 기회를 찾습니다.'} ${state.traits[1]===0?'바로 쓸 돈을 먼저 남깁니다.':'비상금과 장기 자금을 나눕니다.'}`;}

const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const txt=s=>E(s||'미작성');
function fmt(n){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});}
function duration(m){return m%12===0?`${m/12}년`:`${Math.floor(m/12)}년 ${m%12}개월`;}
function tableHTML(q){return q.data?`<div class="table-wrap"><table><thead><tr>${q.data.head.map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${q.data.rows.map(row=>`<tr>${row.map(x=>`<td>${E(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';}
function conceptHTML(q){return `<aside class="concept-scaffold"><b>생각해 볼 관련 개념</b><div>${q.concept.split(' · ').map(c=>`<span class="pill">${E(c)}</span>`).join('')}</div><details><summary>개념 뜻 살펴보기</summary>${q.concept.split(' · ').map(c=>`<p><b>${E(c)}</b> · ${E(CONCEPTS[c]||'목표와 사용 시기를 비교하세요.')}</p>`).join('')}</details></aside>`;}

function emptyRevision(){return {enabled:false,choices:[null],reason:''};}
function blank(){return {version:VERSION,team:'',members:'',name:'',job:'steady',family:'child',life:'home',priority:'balance',traits:[null,null,null,null],goals:AGES.map(()=>({id:'',type:'',text:''})),records:AGES.map(emptyRecord),review:{verdict:'',evidence:'',revisions:AGES.map(emptyRevision),reflection:'',principle:''},view:'profile',age:0};}
function validState(s){const ch=x=>Array.isArray(x)&&x.length===1&&x.every(v=>v===null||[0,1,2].includes(v));return !!s&&s.version===VERSION&&['team','members','name'].every(k=>typeof s[k]==='string')&&JOBS[s.job]&&FAMILIES[s.family]&&LIFE[s.life]&&PRIORITIES[s.priority]&&Array.isArray(s.traits)&&s.traits.length===4&&s.traits.every(x=>x===null||x===0||x===1)&&Array.isArray(s.goals)&&s.goals.length===5&&s.goals.every((g,i)=>g&&typeof g.text==='string'&&((g.id===''&&g.type===''&&g.text==='')||GOAL_CATALOG[i].some(x=>x.id===g.id&&x.type===g.type&&x.text===g.text)))&&Array.isArray(s.records)&&s.records.length===5&&s.records.every((r,i)=>r&&typeof r.sid==='string'&&(!r.sid||(QUESTION_INFO[r.sid]?.age===i&&QUESTION_INFO[r.sid]?.goal===s.goals[i].id))&&ch(r.choices)&&Array.isArray(r.reasons)&&r.reasons.length===1&&r.reasons.every(x=>typeof x==='string')&&typeof r.confirmed==='boolean'&&(!r.confirmed||(r.sid&&r.choices[0]!==null&&r.reasons[0].trim())))&&s.review&&['verdict','evidence','reflection','principle'].every(k=>typeof s.review[k]==='string')&&Array.isArray(s.review.revisions)&&s.review.revisions.length===5&&s.review.revisions.every(r=>r&&typeof r.enabled==='boolean'&&typeof r.reason==='string'&&ch(r.choices))&&['profile','journey','result','review','report','teacher'].includes(s.view)&&Number.isInteger(s.age)&&s.age>=0&&s.age<5;}
let state=blank(),persistOk=true;
try{const embedded=JSON.parse(document.getElementById('embedded-data').textContent),stored=JSON.parse(localStorage.getItem(KEY));if(validState(embedded))state=embedded;else if(validState(stored))state=stored;}catch(e){}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',4000);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persistOk=true;}catch(e){persistOk=false;}document.getElementById('save-status').textContent=persistOk?'이 브라우저에 자동 저장됨 · 제출은 PDF 또는 작성 기록 파일로':'작성 기록 저장 버튼으로 보관하세요';}
function profileReady(){return state.team.trim()&&state.name.trim()&&state.traits.every(x=>x!==null)&&state.goals.every((g,i)=>GOAL_CATALOG[i].some(x=>x.id===g.id));}
function completed(){return state.records.every(r=>r.confirmed&&r.sid&&r.choices[0]!==null&&r.reasons[0].trim());}
function reviewReady(){return state.review.verdict&&state.review.evidence.trim()&&state.review.reflection.trim()&&state.review.principle.trim()&&state.review.revisions.every(r=>!r.enabled||(r.reason.trim()&&r.choices[0]!==null));}
function defaultGoal(i){const ids=['independent','housing',state.family==='child'?'education':'career','retire','living'];if(state.life==='experience')ids[0]='travel';if(state.priority==='growth')ids[0]='seed';const g=GOAL_CATALOG[i].find(x=>x.id===ids[i])||GOAL_CATALOG[i][0];return [g.type,g.text,g.id];}
function setGoal(i,id){if(state.goals[i].id!==id){const g=GOAL_CATALOG[i].find(x=>x.id===id);state.goals[i]=g?{id:g.id,type:g.type,text:g.text}:{id:'',type:'',text:''};for(let z=i;z<5;z++)state.records[z]=emptyRecord();state.review.revisions=AGES.map(emptyRevision);}save();render();}
function invalidate(){state.records=AGES.map(emptyRecord);state.review.revisions=AGES.map(emptyRevision);}
function field(k,v){if(['job','family','life','priority'].includes(k)&&state[k]!==v)invalidate();state[k]=v;save();if(['job','family','life','priority'].includes(k))render();else updateProfileStatus();}
function trait(i,v){if(state.traits[i]!==v){state.traits[i]=v;invalidate();}save();render();}
function updateProfileStatus(){const el=document.getElementById('start-journey');if(el)el.disabled=!profileReady();}
function goto(view){if(view!=='teacher'&&view!=='profile'&&!profileReady()){notify('인물·성향·목표를 먼저 설정하세요.');return;}if(['result','review','report'].includes(view)&&!completed()){notify('다섯 시기의 선택과 이유를 확정하세요.');return;}state.view=view;render();window.scrollTo(0,0);}
function ageGo(i){if(i>0&&!state.records[i-1].confirmed){notify('앞 시기의 선택과 이유를 먼저 확정하세요.');return;}state.age=i;render();window.scrollTo(0,0);}
function routeQuestion(i,g,carry){if(i===1&&g.id==='housing'&&carry.buffer<35)return 'rent';if(i===2&&g.id==='education'&&carry.buffer<35)return 'installment';return Object.keys(QUESTION_INFO).find(k=>QUESTION_INFO[k].age===i&&QUESTION_INFO[k].goal===g.id);}
function questionContext(i,carry){return {name:state.name||'이 인물',g:goalSpec(i),job:state.job,family:state.family,priority:state.priority,traits:state.traits,buffer:carry.buffer,pension:carry.pension};}
function clamp(n){return Math.max(0,Math.min(100,n));}
// makeStage가 이전 선택 설명을 만들 때 시뮬레이션을 다시 호출하지 않도록 연결 설명을 별도로 전달한다.
function stageAt(i,carry,revised=false,last=null){const c=questionContext(i,carry),sid=state.records[i].sid||routeQuestion(i,c.g,carry);return {id:sid,age:AGES[i],goal:state.goals[i].text,type:c.g.title,intro:`${state.name||'이 인물'}의 ${AGES[i]} · ${i===0?'앞으로 바라는 생활: ':''}${FAMILIES[state.family]}. ${LIFE[state.life]}.`,link:last&&last.choices[0]!==null?'앞선 선택: '+last.stage.tasks[0].options[last.choices[0]].title:'',why:'처음에 ‘'+c.g.title+'’ 목표를 골랐습니다. '+(sid==='rent'||sid==='installment'?'앞선 선택으로 바로 쓸 여유가 줄어, 지금 필요한 지출 방법을 먼저 살펴봅니다.':'이 목표를 준비하는 데 필요한 결정을 연습합니다.'),tasks:[questionFor(sid,c)]};}
function makeStage(i,carry,revised=false){return stageAt(i,carry,revised);}
function simulate(revised=false,limit=5){let indices={buffer:45,goal:35,pension:25,experience:35},history=[],sums=[0,0,0,0],count=0;for(let i=0;i<limit;i++){const stage=stageAt(i,indices,revised,history[i-1]),r=state.records[i],rev=state.review.revisions[i],choices=revised&&rev.enabled?rev.choices:r.choices,k=choices[0],outcomes=[];if(k!==null){const o=stage.tasks[0].options[k];['buffer','goal','pension','experience'].forEach((key,z)=>indices[key]=clamp(indices[key]+o.effect[z]));o.ratings.forEach((v,z)=>sums[z]+=v);count++;outcomes.push(o.outcome);}history.push({stage,choices:[...choices],outcomes,indices:{...indices},revised:revised&&rev.enabled});}return {indices,history,sums,count};}
function analyze(revised=false){const a=simulate(revised);const namesKo=['생활 안전','사용 시기 적합성','장기 균형','정보·위험 점검'];const parts=a.sums.map((v,i)=>({name:namesKo[i],value:a.count?Math.round(v/(a.count*2)*25):0}));return {...a,parts,score:parts.reduce((s,p)=>s+p.value,0)};}
function choose(j,k){const i=state.age,before=simulate(false,i),stage=stageAt(i,before.indices,false,before.history[i-1]);state.records[i].sid=stage.id;state.records[i].choices[0]=k;state.records[i].confirmed=false;render();}
function writeReason(j,v){state.records[state.age].reasons[0]=v;state.records[state.age].confirmed=false;save();updateNext();}
function updateNext(){const el=document.getElementById('confirm-stage'),r=state.records[state.age];if(el)el.disabled=r.choices[0]===null||!r.reasons[0].trim();}
function confirmStage(){const i=state.age,r=state.records[i];if(r.choices[0]===null||!r.reasons[0].trim()){notify('선택과 이유를 작성하세요.');return;}if(!r.confirmed&&state.records.slice(i+1).some(r=>r.reasons[0].trim())&&!confirm('앞선 선택을 바꾸면 뒤의 문제도 달라질 수 있어 뒤 기록을 다시 작성합니다. 계속할까요? 원래 기록을 보존하려면 설계 평가·수정을 이용하세요.'))return;if(!r.confirmed){for(let z=i+1;z<5;z++)state.records[z]=emptyRecord();state.review.revisions=AGES.map(emptyRevision);}r.confirmed=true;if(i<4)state.age++;else state.view='result';render();window.scrollTo(0,0);}
function journeyHTML(){const i=state.age,before=simulate(false,i),s=stageAt(i,before.indices,false,before.history[i-1]),q=s.tasks[0],r=state.records[i];return `<div class="actions"><div><span class="badge">${E(state.team)} · ${E(state.name)} · ${typeCode()}</span><h1 style="font-size:34px;margin:12px 0">${AGES[i]}의 금융 선택</h1></div><b>문제 ${i+1} / 5</b></div><div class="age-tabs">${AGES.map((age,z)=>`<button class="${z===i?'active':''} ${state.records[z].confirmed?'done':''}" onclick="ageGo(${z})">${age}${state.records[z].confirmed?' ✓':''}</button>`).join('')}</div><div class="card"><p>${E(s.intro)}</p><div class="soft"><b>우리 인물의 목표</b><p style="margin:6px 0">${E(s.goal)}</p></div>${s.link?`<p style="margin-top:15px"><b>${E(s.link)}</b></p>`:''}<p class="muted">이 문제가 나온 이유: ${E(s.why)}</p></div><div class="card"><span class="badge">이번 시기에는 이 문제 하나만!</span><h2 style="margin-top:12px">${E(q.title)}</h2><p>${E(q.story)}</p>${tableHTML(q)}<div class="options" style="margin-top:18px">${q.options.map((o,k)=>`<button class="option ${r.choices[0]===k?'selected':''}" aria-pressed="${r.choices[0]===k}" onclick="choose(0,${k})"><strong>${'ABC'[k]}. ${E(o.title)}</strong>${E(o.desc)}</button>`).join('')}</div><div class="notice"><b>생각할 질문</b><br>${E(q.prompt)}</div>${conceptHTML(q)}<label for="reason0">그렇게 생각한 이유 *</label><textarea id="reason0" maxlength="4000" oninput="writeReason(0,this.value)" placeholder="이 인물에게 중요한 조건이나 표의 숫자를 한 가지 골라, 선택과 연결해 1~2문장으로 적어 보세요.">${E(r.reasons[0])}</textarea></div><div class="actions"><button class="ghost" onclick="${i?'ageGo('+(i-1)+')':"goto('profile')"}">← ${i?'앞 시기':'인물 설정'}</button><button id="confirm-stage" ${r.choices[0]===null||!r.reasons[0].trim()?'disabled':''} onclick="confirmStage()">${i===4?'확정하고 설계 평가하기':'확정하고 '+AGES[i+1]+'로 이동'} →</button></div>`;}
function reviewField(k,v){state.review[k]=v;save();}
function toggleRevision(i,on){const r=state.review.revisions[i];r.enabled=on;if(on&&r.choices[0]===null)r.choices=[...state.records[i].choices];render();}
function revisionChoice(i,j,v){state.review.revisions[i].choices[0]=Number(v);render();}
function revisionReason(i,v){state.review.revisions[i].reason=v;save();}
function improvement(q,k){const o=q.options[k],better=q.options.filter(x=>x.ratings.reduce((a,b)=>a+b,0)>o.ratings.reduce((a,b)=>a+b,0));return better.length?`보완할 점: ${o.outcome} 다시 비교할 선택: ${better.map(x=>x.title).join(' / ')}.`:'조건에 맞는 판단입니다. 선택을 유지하더라도 포기한 편익과 상황 변화 가능성을 설명하세요.';}
function revisionCards(){const a=analyze(),b=analyze(true);return a.history.map((h,i)=>{const r=state.review.revisions[i],f=b.history[i],q=h.stage.tasks[0],k=h.choices[0];return `<section class="card"><div class="actions" style="margin-top:0"><h2>${AGES[i]} · ${E(q.title)}</h2><label style="margin:0"><input type="checkbox" style="width:auto" ${r.enabled?'checked':''} onchange="toggleRevision(${i},this.checked)"> 선택 수정</label></div><p><b>목표</b> · ${E(goalSpec(i).title)}</p><p><b>처음 선택</b> · ${E(q.options[k].title)}</p><p>${E(state.records[i].reasons[0])}</p><div class="notice">${E(improvement(q,k))}</div>${r.enabled?`<p class="scenario-caption"><b>수정 후 조건으로 다시 보기</b><br>${E(f.stage.tasks[0].story)}</p><label for="rev${i}0">다시 선택하기</label><select id="rev${i}0" onchange="revisionChoice(${i},0,this.value)">${f.stage.tasks[0].options.map((o,z)=>`<option value="${z}" ${r.choices[0]===z?'selected':''}>${E(o.title)}</option>`).join('')}</select><p class="soft"><b>수정 후 예상 효과</b><br>${E(f.outcomes[0])}</p><label for="revreason${i}">수정한 이유 *</label><textarea id="revreason${i}" maxlength="5000" oninput="revisionReason(${i},this.value)">${E(r.reason)}</textarea>`:`<p class="soft"><b>선택의 예상 효과</b><br>${E(h.outcomes[0])}</p>`}</section>`;}).join('');}
function resultHTML(){const a=analyze(),b=analyze(true);return `<section class="hero"><span class="badge">5개 문제 · 금융생활 설계 평가</span><h1>${E(state.name)}의 설계 점검</h1><p>같은 상품도 사용 시기·소득·앞선 선택에 따라 적절성이 달라집니다. 보완 안내를 읽고 아래에서 바로 수정하세요.</p></section><div class="card"><div class="cols"><div><h2>금융 설계 점수</h2><div class="big-number">${b.score}<small style="font-size:18px"> / 100</small></div><p>처음 ${a.score}점 → 현재 ${b.score}점</p><small>실제 수익·행복·미래 자산을 예측하는 점수가 아닙니다.</small></div><div>${b.parts.map(p=>`<p><b>${p.name}</b> ${p.value}/25</p><div class="track"><i style="width:${p.value*4}%"></i></div>`).join('')}</div></div><details><summary>평가 기준</summary><p>5개 선택을 네 항목으로 각각 0~2점 평가하고 항목별 평균을 25점으로 환산합니다. ‘안전하다’는 말만 들어간 선택을 높게 평가하지 않습니다. 목적 달성·사용 시기·생활 여유·정보 이해를 사례 조건에 따라 판단합니다. 성향·직업·가족 형태 자체와 서술 이유는 자동 채점하지 않습니다.</p></details></div><p class="notice">수정 비교에서는 처음 푼 문제 종류를 유지합니다. 앞선 수정에 따라 뒤 문제의 자금 조건과 평가가 달라질 수 있으므로 뒤 선택도 확인하세요. 새로운 문제 경로를 체험하려면 생애 금융 선택에서 앞 시기를 다시 확정하세요.</p>${revisionCards()}<button onclick="goto('review')">우리의 설계를 성찰하기 →</button>`;}
function renderNav(){const tabs=[['profile','① 인물·성향·목표'],['journey','② 생애 금융 선택'],['result','③ 설계 평가·수정'],['review','④ 성찰'],['report','⑤ 발표 보고서'],['teacher','교사용 문제 모음']];document.getElementById('nav').innerHTML=tabs.map(([v,n])=>`<button class="${state.view===v?'active':''}" onclick="goto('${v}')" ${v!=='teacher'&&v!=='profile'&&!profileReady()||['result','review','report'].includes(v)&&!completed()?'disabled':''}>${n}</button>`).join('');}
function render(){renderNav();document.getElementById('screen').innerHTML=({profile:profileHTML,journey:journeyHTML,result:resultHTML,review:reviewHTML,report:reportHTML,teacher:teacherHTML}[state.view]||profileHTML)();save();}
function sourceLinks(){return `<ul><li><a href="https://www.fss.or.kr/edu/main/contents.do?menuNo=300061" target="_blank" rel="noopener">금감원 금융교육센터 · 요청하신 페이지(이번 제작 때 직접 접속 실패)</a></li>${['사회초년기','신혼·자녀출산기','자녀학령기','자녀성년·독립기','은퇴기'].map((n,i)=>`<li><a href="https://lifeinsedu.or.kr/Content/Areas/FinanceKnow/Fadult/0${i+1}_lifecycle.pdf" target="_blank" rel="noopener">금감원 생애주기별 금융생활 가이드북 · ${n} 일반 PDF</a></li>`).join('')}<li><a href="https://www.bok.or.kr/portal/bbs/B0000216/view.do?menuNo=200647&nttId=10072497" target="_blank" rel="noopener">한국은행 퀴즈로 보는 경제강의 · 예금·대출 금리</a></li><li><a href="https://www.bok.or.kr/portal/bbs/B0000216/view.do?menuNo=200134&nttId=10061677" target="_blank" rel="noopener">한국은행 · 금리란 무엇일까요?</a></li><li><a href="https://www.bok.or.kr/portal/bbs/B0000216/view.do?menuNo=200647&nttId=165612" target="_blank" rel="noopener">한국은행 · 고등학생 물가와 인플레이션</a></li><li><a href="https://www.bok.or.kr/portal/bbs/B0000216/view.do?menuNo=201142&nttId=10081790" target="_blank" rel="noopener">한국은행 · 환율 결정과 변동 요인</a></li></ul>`;}
function reportHTML(){return `<div class="actions"><div><h1 style="font-size:32px">우리 모둠의 발표 보고서</h1><p>5개의 선택 → 이유·효과 → 수정 → 모둠의 결론</p></div><button onclick="printReport()">PDF로 저장 / 인쇄</button></div><p class="notice">인쇄 창에서 ‘PDF로 저장’을 선택하세요. A4 세로, 배율 100%, 머리글·바닥글 해제를 권장합니다. 긴 글은 다음 페이지로 이어집니다.</p><button class="outline" onclick="downloadHTML()">작성한 내용 포함 HTML 저장</button>${buildReport()}`;}
function printReport(){if(!completed()||!reviewReady()){notify('5개 문제와 성찰·수정 이유를 모두 작성한 뒤 출력하세요.');return;}document.getElementById('print-area').innerHTML=buildReport();const old=document.title;document.title=`${state.team}_${state.name}_금융생활설계`;window.print();document.title=old;}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function backup(){download(JSON.stringify(state,null,2),`${state.team||'모둠'}_5문제_탐구기록.json`,'application/json');}
async function restore(input){const f=input.files[0];if(!f)return;try{if(f.size>3000000)throw Error('파일이 너무 큽니다.');const s=JSON.parse(await f.text());if(s.version!==VERSION)throw Error('이전 버전은 문제 수와 내용이 달라 적용할 수 없습니다. 이전 HTML에서 기록을 확인하세요.');if(!validState(s))throw Error('유효한 기록 파일이 아닙니다.');if(!confirm('현재 기록을 불러온 기록으로 바꿀까요?'))return;state=s;notify('기록을 불러왔습니다.');}catch(e){notify('불러오기 실패: '+e.message);}finally{input.value='';}}
function downloadHTML(){const doc=document.documentElement.cloneNode(true);doc.querySelector('#embedded-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');['print-area','screen','nav'].forEach(id=>doc.querySelector('#'+id).innerHTML='');doc.querySelector('#toast').style.display='none';download('<!doctype html>\n'+doc.outerHTML,`${state.team||'모둠'}_${state.name||'인물'}_금융탐구.html`,'text/html;charset=utf-8');}
function fillDemo(){if((state.team||state.name)&&!confirm('현재 기록을 교사 예시로 바꿀까요?'))return;state=blank();Object.assign(state,{team:'예시 모둠',members:'교사용 살펴보기',name:'김미래',job:'employee',family:'solo',life:'experience',priority:'growth',traits:[1,0,1,1]});const ids=['seed','housing','education','retire','living'];ids.forEach((id,i)=>{const g=GOAL_CATALOG[i].find(x=>x.id===id);state.goals[i]={id:g.id,type:g.type,text:g.text};});for(let i=0;i<5;i++){const before=simulate(false,i),s=stageAt(i,before.indices,false,before.history[i-1]),q=s.tasks[0];const k=i===0?2:q.options.map((o,k)=>[o.ratings.reduce((a,b)=>a+b,0),k]).sort((a,b)=>b[0]-a[0])[0][1];state.records[i]={sid:s.id,choices:[k],reasons:[i===0?'성장 기회를 기대해 한 기업의 주식을 골랐다. 하지만 비상금을 남겨야 한다는 조건을 놓쳤다.':q.options[k].outcome],confirmed:true};}state.review.revisions[0]={enabled:true,choices:[0],reason:'정기 소득이 있어 필요한 비상금 200만 원을 남기고, 나머지는 여러 기업에 투자하는 펀드로 나누겠다. 원금 손실 위험은 남으므로 사용 시기도 점검하겠다.'};Object.assign(state.review,{verdict:'좋은 선택과 보완할 선택이 함께 있었다',evidence:'20대에 비상금 없이 주식에 집중한 선택이 30대의 주거비 문제로 이어졌다. 숫자와 사용 시기를 함께 비교하는 판단이 필요했다.',reflection:'안전한 상품이 항상 최선인 것도, 수익이 높은 상품이 항상 나쁜 것도 아니었다. 지금 필요한 돈과 오래 둘 돈을 구분해야 했다.',principle:'현명한 금융생활은 인물의 목표·소득·사용 시기와 달라진 경제 환경을 함께 고려해 선택하고 다시 점검하는 것이다.'});state.view='result';render();window.scrollTo(0,0);}
function resetAll(){if(confirm('모든 기록을 삭제할까요? 먼저 작성 기록을 저장할 수 있습니다.')){state=blank();render();}}
function normalizeView(){if(state.view==='teacher')return;if(!profileReady())state.view='profile';else if(!completed()&&['result','review','report'].includes(state.view))state.view='journey';}
let teacherAge='all',teacherQuery='',teacherContext={job:'employee',family:'solo',priority:'balance',buffer:45,pension:50,method:0};
function buildTeacherCases(){return Object.entries(QUESTION_INFO).map(([id,info])=>{const g=GOAL_CATALOG[info.age].find(g=>g.id===info.goal),c={name:'김단원',g,job:teacherContext.job,family:teacherContext.family,priority:teacherContext.priority,traits:[1,0,1,teacherContext.method],buffer:teacherContext.buffer,pension:teacherContext.pension};return {id,i:info.age,info,q:questionFor(id,c),assigned:routeQuestion(info.age,g,c)===id};});}
function filteredTeacherCases(){const query=teacherQuery.trim();return buildTeacherCases().filter(c=>(teacherAge==='all'||c.i===Number(teacherAge))&&(!query||JSON.stringify([c.info,c.q]).includes(query)));}
function teacherCaseHTML(c){const scores=c.q.options.map(o=>o.ratings.reduce((a,b)=>a+b,0)),max=Math.max(...scores);return `<details class="teacher-case card"><summary><span class="badge">${AGES[c.i]} · ${E(c.id)}</span> ${E(c.q.title)}<small>${E(c.info.when)}</small></summary><div class="notice"><b>배정 조건</b> · ${E(c.info.when)}<br><b>바뀌는 조건</b> · ${E(c.info.changes)}<br><b>현재 교사 예시</b> · ${c.assigned?'이 목표와 앞선 여유 조건에서 배정되는 문제':'다른 여유 조건에서 배정되는 문제 · 검토를 위해 함께 표시'}</div><p>${E(c.q.story)}</p>${tableHTML(c.q)}${conceptHTML(c.q)}<p><b>이유 쓰기 질문</b> · ${E(c.q.prompt)}</p><div class="table-wrap"><table><thead><tr><th>선택지</th><th>설명</th><th>효과·해설</th><th>평가 4항목</th></tr></thead><tbody>${c.q.options.map((o,k)=>`<tr><td><b>${'ABC'[k]}. ${E(o.title)}</b></td><td>${E(o.desc)}</td><td>${E(o.outcome)}<br><span class="badge">${scores[k]===max?'현재 조건에서 가장 적합':'조건·보완점 비교'}</span></td><td>${o.ratings.join(' / ')}<br><small>생활·시기·장기·점검<br>각 0~2점</small></td></tr>`).join('')}</tbody></table></div></details>`;}
function teacherSet(k,v){teacherContext[k]=['buffer','pension','method'].includes(k)?Number(v):v;render();}
function teacherSelect(k,label,choices){return `<div><label for="teacher-${k}">${label}</label><select id="teacher-${k}" onchange="teacherSet('${k}',this.value)">${choices.map(([v,n])=>`<option value="${v}" ${String(teacherContext[k])===String(v)?'selected':''}>${n}</option>`).join('')}</select></div>`;}
function teacherHTML(){const list=filteredTeacherCases();return `<section class="hero"><span class="badge">교사용 · 새로운 22개 기본 문제</span><h1>목표와 앞선 선택에 따른 문제 모음</h1><p>학생은 이 중 생애주기마다 하나씩, 총 5문제를 풉니다. 아래에는 서로 다른 상황·선택지를 가진 22개 문제와 조건에 따른 변화가 모두 들어 있습니다.</p></section><div class="card"><h2>문제 배정 방식</h2><p>연령별 목표 4개가 각각 다른 문제로 연결됩니다. 30대 주거·40대 교육 목표는 앞선 선택으로 생활 여유 지표가 35 미만이면 추가 상황으로 바뀝니다. 소득 형태·부양 여부·성향·노후 준비에 따라 문제 수치와 적합한 선택도 달라집니다.</p><p class="muted">이전의 ‘105개 케이스’는 기본 문제의 문구·금액 변형이었습니다. 이번에는 실제로 다른 22개 문제로 구분하고 수치 변형을 별도 문제처럼 세지 않습니다. 지표와 금액은 수업용 가정입니다.</p><h3>예시 조건을 바꾸어 해설 비교하기</h3><div class="three">${teacherSelect('job','소득 형태',[['employee','정기 소득'],['flex','변동 소득']])}${teacherSelect('family','부양·보장 상황',[['solo','자녀 부양 없음 · 의료 보장 공백'],['child','자녀 부양 있음 · 사망 보장 공백']])}${teacherSelect('priority','투자 우선순위',Object.entries(PRIORITIES).map(([k,v])=>[k,v.name]))}${teacherSelect('buffer','앞선 생활 여유 지표',[[20,'낮음 · 20'],[45,'보통 · 45'],[75,'높음 · 75']])}${teacherSelect('pension','앞선 노후 준비 지표',[[25,'낮음 · 25'],[50,'보통 · 50'],[80,'높음 · 80']])}${teacherSelect('method','투자 방식 성향',[[0,'직접 주식·채권 비교'],[1,'펀드 통한 간접 투자']])}</div><div class="cols"><div><label for="teacher-age">연령별 보기</label><select id="teacher-age" onchange="teacherAge=this.value;render()"><option value="all">전체</option>${AGES.map((v,i)=>`<option value="${i}" ${teacherAge===String(i)?'selected':''}>${v}</option>`).join('')}</select></div><div><label for="teacher-search">목표·개념 검색</label><input id="teacher-search" value="${E(teacherQuery)}" placeholder="예: 보험, 금리, 교육" onchange="teacherQuery=this.value;render()"></div></div><div class="actions"><b>${list.length}개 문제</b><div><button class="outline mini" onclick="document.querySelectorAll('.teacher-case').forEach(d=>d.open=true)">모두 펼치기</button> <button class="outline mini" onclick="document.querySelectorAll('.teacher-case').forEach(d=>d.open=false)">모두 접기</button> <button class="mini" onclick="printTeacherCases()">현재 목록 PDF / 인쇄</button></div></div></div>${list.map(teacherCaseHTML).join('')||'<p>검색 결과가 없습니다.</p>'}<details class="card source-list"><summary>자료 참고와 문제 구성 원칙</summary><p>제공된 부교재와 금감원 가이드북의 목표 설정·재무상태 점검·위험 보장·비상자금·노후 소득 과제를 참고했습니다. 업로드한 BRF를 직접 해독한 것은 아니며, 앞서 확인한 일반 PDF본을 활용했습니다. 금감원 요청 페이지는 이번에 직접 접속하지 못했습니다. 한국은행의 예금·대출 금리 퀴즈와 금리·물가·환율 교육 자료를 확인해 개념 적용을 보완했습니다. 문항·인물·숫자·선택지·평가는 새로 구성했습니다. 특정 기관의 퀴즈 원문을 복사한 문제가 아닙니다.</p>${sourceLinks()}</details>`;}
function printTeacherCases(){const list=filteredTeacherCases();document.getElementById('print-area').innerHTML=`<article class="report teacher-print"><h1 class="report-title">교사용 금융생활 문제 모음</h1><p>${list.length}개 기본 문제 · 현재 예시 조건: ${JOBS[teacherContext.job]} / ${FAMILIES[teacherContext.family]} / ${PRIORITIES[teacherContext.priority].name} / 생활 여유 ${teacherContext.buffer} / 노후 준비 ${teacherContext.pension}</p>${list.map(teacherCaseHTML).join('')}</article>`;document.querySelectorAll('#print-area details').forEach(d=>d.open=true);window.print();}


function profileHTML(){return `<section class="hero"><span class="badge">시장 경제와 금융 · 통합사회2</span><h1 style="margin:14px 0">금융 생활과 의사 결정<br>생애주기별 금융생활 설계</h1><p>어떤 일을 하고, 무엇을 중요하게 여기며, 어떤 목표를 준비할까요?<br>처음에는 선택으로 정하고, 생애 속 결정에서는 교과 개념으로 이유를 설명합니다.</p><button class="ghost mini" onclick="fillDemo()">교사용 예시 · 전체 과정 살펴보기</button></section>
<div class="card"><h2>01. 인물의 삶과 투자 기준</h2><div class="cols"><div><label for="team">모둠 이름 *</label><input id="team" maxlength="60" value="${E(state.team)}" oninput="field('team',this.value)" placeholder="예: 미래를 설계하조"><label for="members">모둠원</label><input id="members" maxlength="160" value="${E(state.members)}" oninput="field('members',this.value)" placeholder="학번 또는 이름"><label for="name">가상 인물 이름 *</label><input id="name" maxlength="40" value="${E(state.name)}" oninput="field('name',this.value)" placeholder="예: 김미래"><label for="job">일·소득의 형태</label><select id="job" onchange="field('job',this.value)">${Object.entries(JOBS).map(([k,v])=>`<option value="${k}" ${state.job===k?'selected':''}>${v}</option>`).join('')}</select><p class="muted" style="font-size:13px;margin-top:8px">${JOB_META[state.job].desc}</p></div><div><label for="family">앞으로 함께 살아갈 방식</label><select id="family" onchange="field('family',this.value)">${Object.entries(FAMILIES).map(([k,v])=>`<option value="${k}" ${state.family===k?'selected':''}>${v}</option>`).join('')}</select><label for="life">이 인물이 바라는 삶의 방향</label><select id="life" onchange="field('life',this.value)">${Object.entries(LIFE).map(([k,v])=>`<option value="${k}" ${state.life===k?'selected':''}>${v}</option>`).join('')}</select><label for="priority">투자·돈 관리에서 먼저 보는 기준</label><select id="priority" onchange="field('priority',this.value)">${Object.entries(PRIORITIES).map(([k,v])=>`<option value="${k}" ${state.priority===k?'selected':''}>${v.name}</option>`).join('')}</select><div class="soft" style="margin-top:12px"><b>${PRIORITIES[state.priority].name}</b><p style="margin:7px 0 0">${PRIORITIES[state.priority].desc}</p></div><small>안전성·수익성·유동성은 함께 비교합니다. 성향 자체에는 점수를 매기지 않습니다.</small></div></div></div>
<div class="card"><h2>02. 이 인물은 어떤 투자자일까?</h2><p class="muted">모둠이 만든 인물이 어떻게 생각할지 선택하세요. 특정 성향을 더 좋은 것으로 평가하지 않습니다.</p>${TRAITS.map((t,i)=>`<div class="question"><h3>${i+1}. ${t.q}</h3><div class="choice2">${[0,1].map(v=>`<button class="option ${state.traits[i]===v?'selected':''}" aria-pressed="${state.traits[i]===v}" onclick="trait(${i},${v})"><strong>${E(t[v===0?'a':'b'].split('|')[0])}</strong>${E(t[v===0?'a':'b'].split('|')[1])}</button>`).join('')}</div></div>`).join('')}<div class="soft" aria-live="polite"><span class="badge">우리 인물의 투자·금융 성향</span><h2 style="margin:10px 0">${typeCode()}</h2>${state.traits.every(x=>x!==null)?`<p>${E(typeDescription())}</p><small>${typeNames()}</small>`:'<p>위의 네 가지 선택을 마치면 이 인물의 성향과 이유를 설명해 줍니다.</p>'}<p class="muted" style="font-size:12px;margin:10px 0 0">선택을 정리한 수업용 설명입니다. 검사 결과나 실제 금융상품 가입 기준은 아닙니다.</p></div></div>
<div class="card"><h2>03. 생애주기별 우선 목표 — 하나씩 선택</h2><p>각 시기에 가장 먼저 준비할 목표를 고르세요. <b>금액·기간이 함께 정해지고, 뒤의 상황과 비교 기준에 반영됩니다.</b></p><div class="cols">${AGES.map((age,i)=>`<div class="question" style="margin:0"><h3>${age}</h3><label for="goal-select${i}">우선 목표 *</label><select id="goal-select${i}" onchange="setGoal(${i},this.value)"><option value="">선택하세요</option>${GOAL_CATALOG[i].map(g=>`<option value="${g.id}" ${state.goals[i].id===g.id?'selected':''}>${g.title}</option>`).join('')}</select>${state.goals[i].id?`<p style="margin:12px 0 6px">${E(state.goals[i].text)}</p><span class="pill">${goalSpec(i).cost.toLocaleString('ko-KR')}만 원</span><span class="pill">${duration(goalSpec(i).months)}</span>`:'<p class="muted" style="margin:12px 0 0">주관식 없이 선택하면 됩니다.</p>'}</div>`).join('')}</div><p class="muted" style="margin-top:16px;font-size:13px">금액과 기간은 수업용 가정입니다. 자녀가 없는 경우 ‘교육·배움’은 본인의 배움 비용으로 해석할 수 있습니다.</p><button id="start-journey" ${profileReady()?'':'disabled'} onclick="goto('journey')">이 인물의 생애 금융 선택 시작 →</button></div>
<details class="card source-list"><summary>교사용 안내 · 5개 문제와 평가</summary><p>각 시기에 목표와 앞선 선택에 맞는 문제 하나가 나옵니다. 학생은 총 5개 문제를 선택하고 이유를 기록합니다. 같은 상품도 돈을 사용할 때와 소득 형태에 따라 적절성이 달라집니다.</p><p>설계 평가는 5개 선택의 생활 안전·사용 시기·장기 균형·정보 점검을 각각 0~2점 판단해 항목별 25점으로 환산합니다. 성향·생활 방식 자체와 서술 이유는 자동 채점하지 않습니다.</p><p>이전 기록은 이전 HTML에서 확인하세요. 이 버전은 문제가 달라 새 기록으로 시작합니다.</p><button class="outline" onclick="goto('teacher')">교사용 22개 문제·조건별 해설 보기</button></details>`;}

function reviewHTML(){return `<section class="hero"><span class="badge">성찰 · 우리의 금융생활 원칙</span><h1>우리의 선택은 현명했을까?</h1><p>설계 평가·수정에서 확인한 내용을 바탕으로 생각의 변화를 적어 보세요.</p></section><div class="card"><label for="verdict">우리 모둠의 판단 *</label><select id="verdict" onchange="reviewField('verdict',this.value)"><option value="">선택하세요</option>${['대체로 현명했다','좋은 선택과 보완할 선택이 함께 있었다','수정이 많이 필요하다'].map(x=>`<option ${state.review.verdict===x?'selected':''}>${x}</option>`).join('')}</select><label for="evidence">잘한 선택과 수정·유지한 이유 *</label><textarea id="evidence" maxlength="5000" oninput="reviewField('evidence',this.value)" placeholder="어떤 선택이 목표에 도움이 되었나요? 선택을 바꾸거나 유지한 이유는 무엇인가요?">${E(state.review.evidence)}</textarea><label for="reflection">느낀점 · 달라진 생각 *</label><textarea id="reflection" maxlength="6000" oninput="reviewField('reflection',this.value)">${E(state.review.reflection)}</textarea><label for="principle">우리 모둠의 금융생활 원칙 한 문장 *</label><textarea id="principle" maxlength="2000" oninput="reviewField('principle',this.value)" placeholder="우리는 돈을 관리할 때 …을 고려해야 한다고 생각한다.">${E(state.review.principle)}</textarea><div class="actions"><button class="ghost" onclick="goto('result')">← 설계 평가·수정</button><button onclick="goto('report')">발표 보고서 확인 →</button></div></div>`;}
function buildReport(){const a=analyze(),b=analyze(true);return `<article class="report presentation-report"><div class="report-head"><span class="badge">통합사회2 · 금융 생활과 의사 결정</span><h1 class="report-title">${E(state.name||'가상 인물')}의 생애주기별 금융생활 설계</h1><p>${txt(state.team)} · ${txt(state.members)}</p></div>${!completed()||!reviewReady()?'<div class="notice">작성 중인 보고서입니다.</div>':''}<div class="identity-strip"><div><b>인물의 특징</b><p>${JOBS[state.job]} · ${FAMILIES[state.family]}<br>${LIFE[state.life]}</p></div><div><b>투자 성향 · ${typeCode()}</b><p>${E(typeDescription())}</p><small>${typeNames()}</small></div></div><h2>한눈에 보는 의사 결정 · 우리 모둠의 발표</h2><div class="report-score"><b>처음 ${a.score}점 → 최종 ${b.score}점</b><span>${b.parts.map(p=>p.name+' '+p.value+'/25').join(' · ')}</span></div>${a.history.map((h,i)=>{const f=b.history[i],rev=state.review.revisions[i],changed=rev.enabled&&h.choices.some((k,j)=>k!==f.choices[j]);return `<section class="presentation-age"><div class="age-heading"><span class="age-circle">${AGES[i]}</span><div><h3>${E(goalSpec(i).title)}</h3><small>${E(h.stage.tasks[0].title)}</small></div><span class="badge">${changed?'선택 수정':rev.enabled?'이유 보완':'선택 유지'}</span></div>${h.stage.tasks.map((q,j)=>{const k=h.choices[j],fk=f.choices[j],o=f.stage.tasks[j].options[fk],altered=rev.enabled&&k!==fk;return `<div class="talk-decision"><div class="choice-head"><b>${E(o?.title||'미선택')}</b>${altered?`<small>처음: ${E(q.options[k]?.title||'미선택')}</small>`:''}</div><div class="talk-notes"><div><span class="report-label">${altered?'처음에 그렇게 생각한 이유':'우리 모둠의 선택 이유'}</span><p>${txt(state.records[i].reasons[j])}</p></div><div><span class="report-label">선택의 예상 효과</span><p>${E(o?.outcome||'미선택')}</p></div></div></div>`;}).join('')}${rev.enabled?`<div class="revision-band"><b>${changed?'수정한 이유':'선택을 유지하며 보완한 설명'}</b><p>${txt(rev.reason)}</p></div>`:''}</section>`;}).join('')}<section class="presentation-reflection"><h2>우리 모둠의 결론</h2><div class="soft"><b>${txt(state.review.principle)}</b></div><div class="talk-notes"><div><h3>선택을 돌아보며</h3><p><b>${txt(state.review.verdict)}</b></p><p>${txt(state.review.evidence)}</p></div><div><h3>느낀점 · 달라진 생각</h3><p>${txt(state.review.reflection)}</p></div></div></section><p class="source-note">점수는 5개 선택의 네 항목별 0~2점 평균을 항목별 25점으로 환산한 수업용 지표입니다. 서술 이유는 자동 채점하지 않으며, 예상 효과는 실제 수익이나 미래를 예측하지 않습니다. 참고: 제공된 통합사회 부교재 「금융 생활과 의사 결정」 및 금융감독원 생애주기별 금융생활 가이드북 일반 PDF본.</p></article>`;}
normalizeView();render();
</script></body></html>
